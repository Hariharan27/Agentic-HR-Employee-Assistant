[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-hr-assistant"
version = "0.2.0"
description = "Agentic HR & Employee Assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "langgraph>=0.2,<1",
  "qdrant-client>=1.12,<1.14",
  "fastembed>=0.7,<1",
  "pypdf>=5,<7",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<13",
  "httpx>=0.27,<1",
  "langfuse>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
